[test]
# In order: the environment must be set before any server module reads its configuration.
preload = [
  "./projects/server/testing/preload-environment.ts",
  "./projects/server/testing/preload-database.ts",
  "./projects/server/testing/preload-fetch.ts"
]
# Live tests call real APIs under their own config, run by `mise test:openai`.
pathIgnorePatterns = ["**/*.live.test.ts"]
