# Use this file by passing `--env remote` to mise.
# Contents will be merged with the base file, mise.toml.
# https://mise.jdx.dev/configuration/environments.html

[env]
_.file = ['.env', '.env.local', '.env.remote']

[tasks."import-database"]
description = "Dumps the remote database and restores it locally, then syncs Prisma schema and runs migrations."
run = [
  "mise dev:db:start",
  "mise tunnel mongodump --uri \"$HOF_DATABASE_URL\" --gzip --archive=halloffame.mongoarchive",
  "mongorestore --gzip --archive=halloffame.mongoarchive --uri \"mongodb://localhost/halloffame?replicaSet=rs0\" --nsInclude='default.*' --nsFrom='default.*' --nsTo='halloffame.*' --drop",
  "rm -rf halloffame.mongoarchive",
  "mise exec bun -- bun prisma db push --skip-generate",
  "mise run:cli migrate"
]

[tasks."dashboard:sync"]
description = "Pushes the versioned Metabase dashboards, updating them in place."
# The CLI connects to the database at boot.
run = "mise tunnel mise run:cli dashboard sync"

[tasks."tunnel"]
description = "Runs a command with the remote database reachable, read-only unless --write."
usage = '''
flag "--write" help="Connect with HOF_DATABASE_WRITE_URL, which can write."
arg "<command>" var=#true help="The command to run, its arguments included."
'''
# The remote database only listens on its server's loopback: reach it through an SSH tunnel to
# HOF_REMOTE_SSH, which the database URLs target as 127.0.0.1:27019.
# mise takes --write anywhere on the line, so a wrapped command cannot receive its own --write.
# A nested mise call reloads .env.remote's read-only URL: under --write, run the CLI with bun.
run = """
set -e
if [ "$usage_write" = true ]; then
  export HOF_DATABASE_URL="$HOF_DATABASE_WRITE_URL"
fi
socket="${TMPDIR:-/tmp}/hof-remote-db-$$.sock"
ssh -fNM -S "$socket" -o ExitOnForwardFailure=yes -L 27019:127.0.0.1:5432 "$HOF_REMOTE_SSH"
trap 'ssh -S "$socket" -O exit "$HOF_REMOTE_SSH" 2>/dev/null' EXIT
eval "$usage_command"
"""
