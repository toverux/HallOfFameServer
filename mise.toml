# https://mise.jdx.dev -- One tool to manage languages, env vars, and tasks per project, reproducibly.

redactions = ["*_KEY", "HOF_SYSTEM_PASSWORD", "HOF_DATABASE_URL", "HOF_AZURE_URL", "HOF_SENTRY_DSN"]

[tools]
bun = "1.3.14"
node = "26"

[env]
_.file = [".env", ".env.local"]
_.path = ["{{config_root}}/node_modules/.bin"]

# Use "mise t" to list tasks or "mise r" to interactively select one to run!

# DEVELOPMENT TASKS
# =================

[tasks."dev:deps-upgrade"]
description = "Upgrades mise-en-place, proposes upgrades for tools managed by mise, and proposes upgrades for package.json dependencies."
interactive = true
run = [
  "mise self-update",
  "mise up --interactive --bump",
  # using `mise exec bun` makes sure bun is found if a bun upgrade was just made
  "mise exec bun -- bun update --interactive",
  # make sure transitive dependencies are updated & deduplicated
  "mise exec bun -- bun update"
]

[tasks."dev:server"]
description = "Run server in watch mode."
depends = "dev:db:start"
env = { TF_CPP_MIN_LOG_LEVEL = "1" }
raw = true
run = "bun --watch --no-clear-screen --inspect projects/server/main.ts"

[tasks."dev:client"]
description = "Serve frontend application in development mode."
raw = true
run = "bun ng serve"

[tasks."dev:db:start"]
description = "Start local MongoDB in Docker for development, and wait until it accepts writes."
# Waits as long as the healthcheck's start_period, past which it probes only every 10 minutes.
run = "docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 120 mongo"

[tasks."dev:db:stop"]
description = "Stop local MongoDB Docker container."
run = "docker compose -f docker-compose.dev.yml down"

# CHECK TASKS
# ===========

# check:* are READ-ONLY (idempotent, CI-safe): they verify and write nothing of the source tree.
# The in-place auto-fixers live under fix:* (see FIX TASKS).
# Run `mise fix` locally to apply, `mise check` to verify.
# The `build:prisma:generate` dependency is the one exception, and not a source write: it
# regenerates the gitignored Prisma client that tsc and type-aware oxlint need.

[tasks."check"]
description = "Verify read-only: typescript, oxlint, and oxfmt. Writes nothing, run `mise fix` to auto-fix."
run = ["mise check:tsc", "mise check:oxlint", "mise check:oxfmt"]

[tasks."check:tsc"]
description = "Type-checks code with tsc (read-only)."
depends = "build:prisma:generate"
raw = true
run = "bun --bun tsc --noEmit"

[tasks."check:oxfmt"]
description = "Verifies formatting with oxfmt (read-only, `mise fix:oxfmt` writes)."
raw = true
run = "bun --bun oxfmt --check"

[tasks."check:oxlint"]
description = "Lints with oxlint, warnings denied (read-only, `mise fix:oxlint` auto-fixes)."
depends = "build:prisma:generate"
raw = true
run = "bun --bun oxlint --deny-warnings"

# CHECK TASKS (AGENTS)
# ====================

[tasks."check:agents"]
description = "Verify read-only (typescript, oxlint, oxfmt), output optimized for AI agents. Writes nothing."
run = ["mise check:agents:tsc", "mise check:agents:oxlint", "mise check:oxfmt"]

[tasks."check:agents:tsc"]
description = "Type-checks code with tsc, output optimized for AI agents."
depends = "build:prisma:generate"
raw = true
run = "bun --bun tsc --noEmit --pretty false"

[tasks."check:agents:oxlint"]
description = "Lints with oxlint (read-only, warnings denied), output optimized for AI agents."
depends = "build:prisma:generate"
run = "bun --bun oxlint --deny-warnings --format agent"

# TEST TASKS
# ==========

# Kept out of check:* because `mise build` and the Docker build run `check` without a database.

[tasks."test"]
description = "Runs the server test suite with bun test, against a throwaway database on the dev MongoDB."
depends = ["build:prisma:generate", "dev:db:start"]
raw = true
run = "bun test"

[tasks."test:agents"]
description = "Runs the server test suite, output optimized for AI agents (failures only)."
depends = ["build:prisma:generate", "dev:db:start"]
run = "bun test --only-failures"

# FIX TASKS
# =========

# fix:* WRITE in place (the counterparts to the read-only check:*). For local dev.

[tasks."fix"]
description = "Auto-fix in place: oxlint --fix, then oxfmt. `mise check` is the read-only counterpart."
# Sequential, lint then format, so formatting settles after lint rewrites.
run = ["mise fix:oxlint", "mise fix:oxfmt"]

[tasks."fix:oxlint"]
description = "Auto-fixes lint issues with oxlint (writes, `mise check:oxlint` only reports)."
depends = "build:prisma:generate"
raw = true
run = "bun --bun oxlint --fix"

[tasks."fix:oxfmt"]
description = "Formats code in place with oxfmt (writes, `mise check:oxfmt` only verifies)."
raw = true
run = "bun --bun oxfmt"

# BUILD TASKS
# ===========

[tasks.build]
description = "Build the application for production."
depends = ["check", "build:client"]
raw = true

[tasks."build:client"]
description = "Build the frontend application."
raw = true
run = "bun ng build"

[tasks."build:prisma:generate"]
description = "Generates the gitignored Prisma client and types."
sources = ["prisma/run-prisma-generate.ts", "prisma/schema.prisma"]
raw = true
run = "bun prisma/run-prisma-generate.ts"

# RUN TASKS
# =========

[tasks."run:cli"]
description = "Run the CLI app."
env = { TF_CPP_MIN_LOG_LEVEL = "1" }
raw = true
run = "bun projects/server/cli/main.ts"

[tasks."run:server"]
description = "Run the server app."
env = { TF_CPP_MIN_LOG_LEVEL = "1" }
raw = true
run = "bun projects/server/main.ts"

[tasks."run:server:light"]
description = "Run the server app, using a smaller heap -- useful when working on the mod with the editor and game open so the server does not consume too much memory."
env = { TF_CPP_MIN_LOG_LEVEL = "1" }
raw = true
run = "bun --smol projects/server/main.ts"
